<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Warehouse Cloud Test</title>
</head>
<body>

<h1>Warehouse Cloud Test</h1>

<button id="addBtn">Add Test Item</button>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwXFFWuYZ0aOqc43Hz4hBuhKEy9ojx8314akyBxWTzat6mO35b2eK-G9VXyWLkcIBaM/exec';

document.getElementById('addBtn').onclick = async () => {
  const params = new URLSearchParams({
    user: 'Admin',
    action: 'ADD',
    item: 'Jade',
    qty: 1
  });

  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded'
    },
    body: params
  });

  const text = await res.text();
  alert(text);
};
</script>

</body>
</html>
