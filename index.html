<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Warehouse Cloud Test</title>
</head>
<body>

<h1>Warehouse Cloud Test</h1>

<button id="addBtn">Add Test Item</button>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwXFFWuYZ0aOqc43Hz4hBuhKEy9ojx8314akyBxWTzat6mO35b2eK-G9VXyWLkcIBaM/exec";

document.getElementById("addBtn").addEventListener("click", () => {
  const params = new URLSearchParams();
  params.append("user", "Admin");
  params.append("action", "ADD");
  params.append("item", "Jade");
  params.append("qty", "1");

  fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: params.toString()
  })
  .then(res => res.json())
  .then(data => {
    alert(JSON.stringify(data));
  })
  .catch(err => {
    alert("Fetch error: " + err);
  });
});
</script>

</body>
</html>
